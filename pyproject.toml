[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-swarm"
version = "1.1.0"
description = "A team of AI builders a non-technical owner directs by talking: it asks in plain words, never breaks what works, and hands back a tested branch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=43", "jsonschema>=4.22", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
mcp = ["mcp>=1.12.4,<2"]
voice = ["faster-whisper>=1.0"]
api = ["anthropic>=1.0"]   # replies straight from the Anthropic API, streamed (hive llm api)
data = ["psycopg[binary]>=3.1", "pymysql>=1.1", "openpyxl>=3.1", "pypdf>=4"]   # reading his Postgres, MySQL, Excel and PDF files
secure = ["cryptography>=43", "keyring>=25"]
memory = ["fastembed>=0.4"]
speech = ["piper-tts>=1.3", "imageio-ffmpeg>=0.5"]   # Hive answers a voice note in voice (hive/voice.py), on this machine   # recall by meaning, not only words (hive/embed.py; runs on this machine)   # his keys and passwords encrypted on disk (hive secrets); keychain optional

[project.scripts]
hive = "hive.__main__:main"

[tool.setuptools]
packages = ["hive"]

[tool.setuptools.package-data]
hive = ["templates/*.md", "templates/browser*"]
