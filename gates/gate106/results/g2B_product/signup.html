<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator sign-up</title><link rel="stylesheet" href="style.css"></head>
<body>
  <nav>☀️ Sunny Shop</nav>
  <main>
    <h1>Join as a creator</h1>
    <p>No GST needed. Takes 1 minute.</p>
    <form action="dashboard.html">
      <label>Your name</label><input name="name" required>
      <label>Email</label><input name="email" type="email" required>
      <label>Phone</label><input name="phone" type="tel" inputmode="numeric" required>
      <label>Instagram handle</label><input name="instagram" placeholder="@yourhandle" required>
      <button type="submit">Join and see deals</button>
      <p>We'll ask for PAN and bank details only when you're about to get paid.</p>
    </form>
  </main>
</body></html>
