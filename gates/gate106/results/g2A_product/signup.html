<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator sign-up</title><link rel="stylesheet" href="style.css"></head>
<body>
  <nav>☀️ Sunny Shop</nav>
  <main>
    <h1>Join Sunny Shop</h1>
    <form action="dashboard.html">
      <label>Your name</label><input name="name" required>
      <label>Instagram handle</label><input name="instagram" required>
      <label>Phone</label><input name="phone" type="tel" inputmode="tel" required>
      <label>Email</label><input name="email" type="email" required>
      <button type="submit">See deals</button>
      <p>You'll add PAN and bank details only when you get paid for your first deal.</p>
    </form>
  </main>
</body></html>
