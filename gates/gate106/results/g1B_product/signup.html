<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator sign-up</title><link rel="stylesheet" href="style.css"></head>
<body>
  <nav>☀️ Sunny Shop</nav>
  <main>
    <h1>Join as a creator</h1>
    <form action="dashboard.html">
      <label for="name">Your name</label><input id="name" name="name" autocomplete="name" required>
      <label for="phone">Phone</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required>
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="instagram">Instagram handle</label><input id="instagram" name="instagram" placeholder="@yourhandle" required>
      <button type="submit">Sign up free</button>
      <p>We'll ask for PAN and bank details only when you get your first payout.</p>
    </form>
  </main>
</body></html>
