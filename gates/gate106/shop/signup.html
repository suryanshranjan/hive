<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator sign-up</title><link rel="stylesheet" href="style.css"></head>
<body>
  <nav>☀️ Sunny Shop</nav>
  <main>
    <h1>Creator registration</h1>
    <form action="dashboard.html">
      <label>Full name (as on PAN)</label><input name="name" required>
      <label>Email</label><input name="email" type="email" required>
      <label>Phone</label><input name="phone" required>
      <label>Instagram handle</label><input name="instagram" required>
      <label>PAN number</label><input name="pan" required>
      <label>GST number</label><input name="gst" required>
      <label>Bank account number</label><input name="account" required>
      <label>IFSC code</label><input name="ifsc" required>
      <label>Full postal address</label><input name="address" required>
      <button type="submit">Submit registration</button>
    </form>
  </main>
</body></html>
